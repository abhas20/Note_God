name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Run root ESLint
        run: npm run lint

      - name: Run root TypeScript type checking
        run: npx tsc --noEmit

      - name: Install socket-server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./socket-server

      - name: Run socket-server type checking
        run: npx tsc -p . --noEmit
        working-directory: ./socket-server

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality-check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Main App (used by note-god and workers)
      - name: Build and Push Note-God App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/abhas20/note-god:latest
          build-args: |
            NEXT_PUBLIC_SOCKET_SERVER_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}

      # Build Socket Server
      - name: Build and Push Socket Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./socket-server/Dockerfile
          push: true
          tags: ghcr.io/abhas20/note-god-socket-server:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: Production
      url: https://note-god.duckdns.org

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/azureuser/Note_God
            git pull origin main
            
            # Pull the new images from GHCR
            docker compose pull
            
            # Restart containers with the new images
            docker compose up -d
            
            # Clean up old images to save disk space
            docker image prune -af