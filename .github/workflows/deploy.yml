name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Run root ESLint
        run: npm run lint

      - name: Run root TypeScript type checking
        run: npx tsc --noEmit

      - name: Install socket-server dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./socket-server

      - name: Run socket-server type checking
        run: npx tsc -p . --noEmit
        working-directory: ./socket-server

  deploy:
    runs-on: ubuntu-latest
    needs: quality-check
    environment:
      name: Production
      url: https://note-god.duckdns.org

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            # Navigate to the application directory
            cd /home/ubuntu/Note_God

            # Pull the latest changes from the repository
            git pull origin main

            #Docker build and run commands
            docker compose up -d --build

            # Clean up unused Docker images
            docker image prune -f
